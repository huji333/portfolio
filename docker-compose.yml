services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env.development
    volumes:
      - ./backend:/app
    # e2e（Playwright）が localhost:3000 を直叩きするため互換用に公開を維持
    ports:
      - '3000:3000'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
      FRONTEND_ORIGIN: "http://localhost:3002"
      # Solid Queue ワーカーを Puma 内で起動（本番と同じ構成）
      SOLID_QUEUE_IN_PUMA: "1"
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # 起動のたびに node_modules を lockfile と整合させてから dev を起動する。
    # named volume は「初回だけイメージからコピーされ以後更新されない」ため、
    # 依存を bump しても volume が stale 化して `command not found: next` を起こす。
    # 起動時 install で volume を自己修復するキャッシュにし、volume の手動削除を不要にする。
    command: sh -c "yarn install --immutable && yarn dev"
    # e2e（Playwright）が localhost:3002 を直叩きするため互換用に公開を維持
    ports:
      - '3002:3002'
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:3000/api"
      API_BASE_URL: "http://backend:3000/api"
      TURBOPACK_FS_CACHE: "0"
    depends_on:
      - backend
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGHOST: db
    volumes:
      - ./backend:/app
    command: bundle exec rails db:migrate
    depends_on:
      - db

volumes:
  db_data:
  frontend_node_modules:
